<!doctype html>
<!-- Statyczna strona-docelowa OAuth pCloud (implicit flow, response_type=token).
     Bilet 03: parsuje token/hostname/locationid z fragmentu, waliduje state (anty-CSRF),
     przekazuje do appki przez postMessage + localStorage + IDB mirror, czyści fragment z URL.

     Prod redirect: https://danielmroczek.github.io/rate-wave/oauth.html
     Dev redirect:  http://localhost:5173/ (→ trafia na index.html, nie tę stronę)

     Logika w src/auth/oauth-page.js (Vite bundluje ten wpis jako multi-page entry). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>rate-wave — OAuth</title>
    <style>
      body {
        background: #0f1115;
        color: #e8ecf3;
        font:
          15px/1.45 system-ui,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100dvh;
        margin: 0;
      }
      .box {
        background: #171a21;
        border-radius: 12px;
        padding: 24px;
        max-width: 420px;
        text-align: center;
      }
      .hint {
        color: #9aa4b5;
        font-size: 12px;
        margin-top: 10px;
      }
      .error {
        color: #ff5d5d;
      }
    </style>
  </head>
  <body>
    <main class="box" id="status">
      <h1>rate-wave</h1>
      <p id="msg">Signing in to pCloud…</p>
      <p class="hint" id="detail"></p>
    </main>
    <script type="module" src="/src/auth/oauth-page.js"></script>
  </body>
</html>
